[package]
name = "coffeeworks-launcher"
version = "2.4.0"
description = "Launcher y orquestador para la suite ofimática CoffeWorks"
authors = ["CoffeWorks OpenSource Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
