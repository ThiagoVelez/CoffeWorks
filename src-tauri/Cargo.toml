[package]
name = "coffeeworks-launcher"
description = "Launcher y gestor de aplicaciones de la suite ofimática CoffeeWorks"
version.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "CoffeeWorks"
path = "src/main.rs"

[features]
# Activa el modo de producción (frontend embebido en el ejecutable).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
open = { workspace = true }
coffee-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }
