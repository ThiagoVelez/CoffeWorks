# Espacio de trabajo Cargo de la suite CoffeeWorks.
# Compila el Launcher y las tres aplicaciones como ejecutables independientes
# compartiendo dependencias y una sola carpeta `target/`.
[workspace]
resolver = "2"
members = [
  "crates/coffee-core",
  "src-tauri",
  "CoffeeDoc/src-tauri",
  "CoffeeCalc/src-tauri",
  "CoffeeView/src-tauri",
  "CoffeePDF/src-tauri",
  "CoffeePage/src-tauri",
  "CoffeeBooks/src-tauri",
  "CoffeeEdit/src-tauri",
  "CoffeeLive/src-tauri",
  "CoffeeDataBase/src-tauri",
  "CoffeeUIUX/src-tauri",
  "CoffeeUML/src-tauri",
  "CoffeePhoto/src-tauri",
  "CoffeeVector/src-tauri",
  "CoffeePaint/src-tauri",
  "CoffeeLens/src-tauri",
  "CoffeeMotion/src-tauri",
  "CoffeeSound/src-tauri",
  "CoffeeEncoder/src-tauri",
  "CoffeeAnimate/src-tauri",
  "CoffeePuppet/src-tauri",
]

[workspace.package]
version = "2.9.0"
authors = ["CoffeeWorks OpenSource Team"]
edition = "2021"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
dirs = "5"
open = "5"
coffee-core = { path = "crates/coffee-core" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
