name: Instalador de Windows

# Compila la suite en Windows, crea el instalador con Inno Setup, lo prueba
# (instalación silenciosa, instalar y desinstalar apps, arranque de las
# ventanas) y lo publica como artefacto descargable de la ejecución.
# Al subir una etiqueta "v*" se adjunta además a una versión (Release).

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y empaquetar
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Pruebas del núcleo
        run: cargo test -p coffee-core

      - name: Código compartido y temas al día
        run: |
          node scripts/sync-shared.mjs --check
          node scripts/make-theme.mjs --check

      - name: Compilar la suite
        run: node scripts/build.mjs

      - name: Descargar el instalador de WebView2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile installer/build/MicrosoftEdgeWebview2Setup.exe -UseBasicParsing

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Crear el instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\CoffeeWorks.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup devolvió un error" }
          Get-ChildItem installer\Output

      - name: Probar el instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert($condition, $message) {
            if (-not $condition) { throw "FALLO: $message" } else { Write-Host "OK: $message" }
          }
          function Run($exe, $arguments) {
            $process = Start-Process $exe -ArgumentList $arguments -Wait -PassThru
            return $process.ExitCode
          }

          $setup = (Get-ChildItem installer\Output\*.exe | Select-Object -First 1).FullName
          $dir = "C:\cw-test"
          $code = Run $setup @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir")
          Assert ($code -eq 0) "el instalador termina sin errores"
          Assert (Test-Path "$dir\CoffeeWorks.exe") "el Launcher queda instalado"
          Assert (Test-Path "$dir\packages\CoffeeDoc.exe") "los paquetes de las apps quedan disponibles"
          Assert (Test-Path "$dir\packages\dictionaries\es.dic") "se instalan los diccionarios ortográficos"

          $apps = "$env:LOCALAPPDATA\CoffeeWorks\Apps"
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CoffeeWorks"
          Assert (-not (Test-Path "$apps\CoffeeDoc\CoffeeDoc.exe")) "las apps no se instalan hasta pedirlo"

          Assert ((Run "$dir\CoffeeWorks.exe" @("--install", "coffeedoc")) -eq 0) "instalar CoffeeDoc desde el Launcher"
          Assert (Test-Path "$apps\CoffeeDoc\CoffeeDoc.exe") "CoffeeDoc queda instalado"
          Assert (Test-Path "$menu\CoffeeDoc.lnk") "se crea el acceso directo del menú Inicio"
          $association = (Get-ItemProperty "HKCU:\Software\Classes\.cfd" -ErrorAction SilentlyContinue).'(default)'
          Assert ($association -eq "CoffeeWorks.CoffeeDoc.cfd") "se asocia el tipo de archivo .cfd"

          Assert ((Run "$dir\CoffeeWorks.exe" @("--install-all")) -eq 0) "instalar todas las apps"
          # Complementos: descarga real desde la versión «addons», como al pulsar «Instalar»
          Assert ((Run "$dir\CoffeeWorks.exe" @("--install-addon", "potrace")) -eq 0) "instalar el complemento Potrace"
          Assert (Test-Path "$env:LOCALAPPDATA\CoffeeWorks\Addons\potrace\potrace.exe") "Potrace queda instalado"
          Assert ((Run "$dir\CoffeeWorks.exe" @("--install-addon", "raw")) -eq 0) "instalar el complemento RAW"
          Assert (Test-Path "$env:LOCALAPPDATA\CoffeeWorks\Addons\raw\dcraw_emu.exe") "LibRaw queda instalado"
          Assert (Test-Path "$apps\CoffeeCalc\CoffeeCalc.exe") "CoffeeCalc queda instalado"
          Assert (Test-Path "$apps\CoffeeView\CoffeeView.exe") "CoffeeView queda instalado"
          Assert (Test-Path "$apps\CoffeePDF\CoffeePDF.exe") "CoffeePDF queda instalado"
          Assert (Test-Path "$apps\CoffeePage\CoffeePage.exe") "CoffeePage queda instalado"
          Assert (Test-Path "$apps\CoffeeDataBase\CoffeeDataBase.exe") "CoffeeDataBase queda instalado"
          Assert (Test-Path "$apps\CoffeeEdit\CoffeeEdit.exe") "CoffeeEdit queda instalado"
          Assert (Test-Path "$apps\CoffeeLive\CoffeeLive.exe") "CoffeeLive queda instalado"
          Assert (Test-Path "$apps\CoffeeUIUX\CoffeeUIUX.exe") "CoffeeUI/UX queda instalado"
          Assert (Test-Path "$apps\CoffeeUML\CoffeeUML.exe") "CoffeeUML queda instalado"
          Assert (Test-Path "$apps\CoffeePhoto\CoffeePhoto.exe") "CoffeePhoto queda instalado"
          Assert (Test-Path "$apps\CoffeeVector\CoffeeVector.exe") "CoffeeVector queda instalado"
          Assert (Test-Path "$apps\CoffeePaint\CoffeePaint.exe") "CoffeePaint queda instalado"
          Assert (Test-Path "$apps\CoffeeLens\CoffeeLens.exe") "CoffeeLens queda instalado"
          Assert (Test-Path "$apps\CoffeeMotion\CoffeeMotion.exe") "CoffeeMotion queda instalado"
          Assert (Test-Path "$apps\CoffeeSound\CoffeeSound.exe") "CoffeeSound queda instalado"
          Assert (Test-Path "$apps\CoffeeEncoder\CoffeeEncoder.exe") "CoffeeEncoder queda instalado"
          Assert (Test-Path "$apps\CoffeeAnimate\CoffeeAnimate.exe") "CoffeeAnimate queda instalado"
          Assert (Test-Path "$apps\CoffeePuppet\CoffeePuppet.exe") "CoffeePuppet queda instalado"
          Assert (Test-Path "$apps\CoffeeBooks\CoffeeBooks.exe") "CoffeeBooks queda instalado"
          $cbk = (Get-ItemProperty "HKCU:\Software\Classes\.cbk" -ErrorAction SilentlyContinue).'(default)'
          Assert ($cbk -eq "CoffeeWorks.CoffeeBooks.cbk") "se asocia el tipo de archivo .cbk"
          Assert (Test-Path "$menu\CoffeeUIUX.lnk") "se crea el acceso directo de CoffeeUI/UX"
          $cpg = (Get-ItemProperty "HKCU:\Software\Classes\.cpg" -ErrorAction SilentlyContinue).'(default)'
          Assert ($cpg -eq "CoffeeWorks.CoffeePage.cpg") "se asocia el tipo de archivo .cpg"
          $ccm = (Get-ItemProperty "HKCU:\Software\Classes\.ccm" -ErrorAction SilentlyContinue).'(default)'
          Assert ($ccm -eq "CoffeeWorks.CoffeeEdit.ccm") "se asocia el tipo de archivo .ccm"
          $clv = (Get-ItemProperty "HKCU:\Software\Classes\.clv" -ErrorAction SilentlyContinue).'(default)'
          Assert ($clv -eq "CoffeeWorks.CoffeeLive.clv") "se asocia el tipo de archivo .clv"
          $cdb = (Get-ItemProperty "HKCU:\Software\Classes\.cdb" -ErrorAction SilentlyContinue).'(default)'
          Assert ($cdb -eq "CoffeeWorks.CoffeeDataBase.cdb") "se asocia el tipo de archivo .cdb"
          $cux = (Get-ItemProperty "HKCU:\Software\Classes\.cux" -ErrorAction SilentlyContinue).'(default)'
          Assert ($cux -eq "CoffeeWorks.CoffeeUIUX.cux") "se asocia el tipo de archivo .cux"
          $cuml = (Get-ItemProperty "HKCU:\Software\Classes\.cuml" -ErrorAction SilentlyContinue).'(default)'
          Assert ($cuml -eq "CoffeeWorks.CoffeeUML.cuml") "se asocia el tipo de archivo .cuml"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.cph" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeePhoto.cph") "se asocia el tipo de archivo .cph"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.cvc" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeeVector.cvc") "se asocia el tipo de archivo .cvc"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.cpt" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeePaint.cpt") "se asocia el tipo de archivo .cpt"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.clc" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeeLens.clc") "se asocia el tipo de archivo .clc"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.cmo" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeeMotion.cmo") "se asocia el tipo de archivo .cmo"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.csn" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeeSound.csn") "se asocia el tipo de archivo .csn"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.cen" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeeEncoder.cen") "se asocia el tipo de archivo .cen"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.can" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeeAnimate.can") "se asocia el tipo de archivo .can"
          $t = (Get-ItemProperty "HKCU:\Software\Classes\.cpup" -ErrorAction SilentlyContinue).'(default)'
          Assert ($t -eq "CoffeeWorks.CoffeePuppet.cpup") "se asocia el tipo de archivo .cpup"
          $pdfDefault = (Get-ItemProperty "HKCU:\Software\Classes\.pdf" -ErrorAction SilentlyContinue).'(default)'
          Assert ($pdfDefault -ne "CoffeeWorks.CoffeePDF.pdf") "CoffeePDF no reemplaza el lector de PDF predeterminado"
          Assert ((Get-ItemProperty "HKCU:\Software\Classes\.pdf\OpenWithProgids" -ErrorAction SilentlyContinue).'CoffeeWorks.CoffeePDF.pdf' -ne $null) "CoffeePDF aparece en Abrir con"

          # Las ventanas deben arrancar y seguir abiertas
          New-Item -ItemType Directory -Force screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          foreach ($exe in @("$dir\CoffeeWorks.exe", "$apps\CoffeeDoc\CoffeeDoc.exe", "$apps\CoffeeCalc\CoffeeCalc.exe", "$apps\CoffeeView\CoffeeView.exe", "$apps\CoffeePDF\CoffeePDF.exe", "$apps\CoffeePage\CoffeePage.exe", "$apps\CoffeeBooks\CoffeeBooks.exe", "$apps\CoffeeDataBase\CoffeeDataBase.exe", "$apps\CoffeeEdit\CoffeeEdit.exe", "$apps\CoffeeLive\CoffeeLive.exe", "$apps\CoffeeUIUX\CoffeeUIUX.exe", "$apps\CoffeeUML\CoffeeUML.exe", "$apps\CoffeePhoto\CoffeePhoto.exe", "$apps\CoffeeVector\CoffeeVector.exe", "$apps\CoffeePaint\CoffeePaint.exe", "$apps\CoffeeLens\CoffeeLens.exe", "$apps\CoffeeMotion\CoffeeMotion.exe", "$apps\CoffeeSound\CoffeeSound.exe", "$apps\CoffeeEncoder\CoffeeEncoder.exe", "$apps\CoffeeAnimate\CoffeeAnimate.exe", "$apps\CoffeePuppet\CoffeePuppet.exe")) {
            $name = [IO.Path]::GetFileNameWithoutExtension($exe)
            $process = Start-Process $exe -PassThru
            Start-Sleep -Seconds 12
            Assert (-not $process.HasExited) "$name arranca y sigue en ejecución"
            try {
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save("screenshots\$name.png")
            } catch { Write-Host "No se pudo capturar la pantalla: $_" }
            Stop-Process -Id $process.Id -Force
            Start-Sleep -Seconds 2
          }

          Assert ((Run "$dir\CoffeeWorks.exe" @("--uninstall", "coffeecalc")) -eq 0) "desinstalar CoffeeCalc"
          Assert (-not (Test-Path "$apps\CoffeeCalc")) "CoffeeCalc se elimina"
          Assert (-not (Test-Path "$menu\CoffeeCalc.lnk")) "se quita su acceso directo"
          Assert ((Run "$dir\CoffeeWorks.exe" @("--uninstall", "coffeepdf")) -eq 0) "desinstalar CoffeePDF"
          Assert (-not (Test-Path "$apps\CoffeePDF")) "CoffeePDF se elimina"
          Assert ((Get-ItemProperty "HKCU:\Software\Classes\.pdf\OpenWithProgids" -ErrorAction SilentlyContinue).'CoffeeWorks.CoffeePDF.pdf' -eq $null) "se retira CoffeePDF de Abrir con"

          # Migración desde la versión anterior («CoffeWorks»): se simula una
          # instalación antigua de CoffeDoc con un documento y su asociación
          $legacyApp = "$env:LOCALAPPDATA\CoffeWorks\Apps\CoffeDoc"
          New-Item -ItemType Directory -Force $legacyApp | Out-Null
          Copy-Item "$apps\CoffeeDoc\CoffeeDoc.exe" "$legacyApp\CoffeDoc.exe"
          $docs = [Environment]::GetFolderPath("MyDocuments")
          New-Item -ItemType Directory -Force "$docs\CoffeWorks" | Out-Null
          Set-Content "$docs\CoffeWorks\viejo.cfd" '{"format":"coffedoc","content":"<p>hola</p>"}'
          New-Item -Force "HKCU:\Software\Classes\.cfd" -Value "CoffeWorks.CoffeDoc.cfd" | Out-Null
          New-Item -Force "HKCU:\Software\Classes\CoffeWorks.CoffeDoc.cfd" -Value "Documento antiguo" | Out-Null
          Assert ((Run "$dir\CoffeeWorks.exe" @("--list")) -eq 0) "el Launcher arranca con restos de la versión anterior"
          Assert (-not (Test-Path $legacyApp)) "se retira la copia antigua de CoffeDoc"
          Assert (Test-Path "$docs\CoffeeWorks\viejo.cfd") "los documentos antiguos pasan a Documentos\CoffeeWorks"
          Assert (-not (Test-Path "HKCU:\Software\Classes\CoffeWorks.CoffeDoc.cfd")) "se quita la asociación antigua"
          $association = (Get-ItemProperty "HKCU:\Software\Classes\.cfd" -ErrorAction SilentlyContinue).'(default)'
          Assert ($association -eq "CoffeeWorks.CoffeeDoc.cfd") ".cfd vuelve a abrirse con CoffeeDoc"

          # CoffeeCams (2.5) se dividió en CoffeeEdit y CoffeeLive: se simula que estaba instalado
          Assert ((Run "$dir\CoffeeWorks.exe" @("--uninstall", "coffeeedit")) -eq 0) "desinstalar CoffeeEdit para la prueba"
          New-Item -ItemType Directory -Force "$apps\CoffeeCams" | Out-Null
          Copy-Item "$apps\CoffeeLive\CoffeeLive.exe" "$apps\CoffeeCams\CoffeeCams.exe"
          New-Item -Force "HKCU:\Software\Classes\.ccm" -Value "CoffeeWorks.CoffeeCams.ccm" | Out-Null
          New-Item -Force "HKCU:\Software\Classes\CoffeeWorks.CoffeeCams.ccm" -Value "Proyecto antiguo" | Out-Null
          Assert ((Run "$dir\CoffeeWorks.exe" @("--list")) -eq 0) "el Launcher arranca con CoffeeCams instalado"
          Assert (-not (Test-Path "$apps\CoffeeCams")) "se retira CoffeeCams"
          Assert (Test-Path "$apps\CoffeeEdit\CoffeeEdit.exe") "CoffeeEdit lo sustituye"
          $ccm = (Get-ItemProperty "HKCU:\Software\Classes\.ccm" -ErrorAction SilentlyContinue).'(default)'
          Assert ($ccm -eq "CoffeeWorks.CoffeeEdit.ccm") ".ccm pasa a CoffeeEdit"

          # Actualización automática: el Launcher ejecuta el instalador nuevo en
          # silencio sobre la instalación existente (sin reinstalar apps quitadas)
          $code = Run $setup @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/AUTOUPDATE=0")
          Assert ($code -eq 0) "la actualización silenciosa termina sin errores"
          Assert (Test-Path "$dir\CoffeeWorks.exe") "el Launcher sigue instalado tras actualizar"
          Assert (-not (Test-Path "$apps\CoffeeCalc")) "la actualización no reinstala apps que el usuario quitó"
          # Un paquete nuevo se copia sobre la app instalada
          Add-Content -Path "$dir\packages\CoffeeDoc.exe" -Value "actualizado" -Encoding ascii
          Assert ((Run "$dir\CoffeeWorks.exe" @("--refresh-apps")) -eq 0) "poner al día las apps instaladas"
          Assert (Test-Path "$env:LOCALAPPDATA\CoffeeWorks\Dictionaries\en.aff") "los diccionarios quedan en la carpeta común"
          Assert ((Get-Item "$apps\CoffeeDoc\CoffeeDoc.exe").Length -eq (Get-Item "$dir\packages\CoffeeDoc.exe").Length) "CoffeeDoc recibe el paquete nuevo"

          $uninstaller = (Get-ChildItem "$dir\unins*.exe" | Select-Object -First 1).FullName
          Assert ((Run $uninstaller @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")) -eq 0) "el desinstalador termina sin errores"
          Start-Sleep -Seconds 5
          Assert (-not (Test-Path "$dir\CoffeeWorks.exe")) "el Launcher se elimina"
          Assert (-not (Test-Path "$apps\CoffeeDoc\CoffeeDoc.exe")) "las apps instaladas se eliminan"

      - name: Suma SHA-256 del instalador
        shell: pwsh
        run: |
          # El Launcher la comprueba antes de instalar una actualización
          $setup = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$($setup.FullName).sha256", "$hash  $($setup.Name)")
          Get-Content "$($setup.FullName).sha256"

      - name: Publicar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: CoffeeWorks-Setup
          path: |
            installer/Output/*.exe
            installer/Output/*.sha256
          if-no-files-found: error

      - name: Publicar capturas de la prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-prueba
          path: screenshots/*.png
          if-no-files-found: ignore

      - name: Adjuntar a la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*.exe
            installer/Output/*.sha256

      # Actualizaciones automáticas: si la versión de main todavía no está
      # publicada, se crea su Release y los Launcher instalados la descargan.
      # Para publicar una actualización basta con subir la versión
      # (node scripts/version.mjs X.Y.Z) y llevar el cambio a main.
      - name: Publicar la versión nueva
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = ([regex]::Match((Get-Content src-tauri\src\updater.rs -Raw), 'pub const STAGE: &str = "([^"]*)"')).Groups[1].Value
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La versión $tag ya está publicada: no se crea otra."
            exit 0
          }
          $setup = (Get-ChildItem installer\Output\*.exe | Select-Object -First 1).FullName
          $title = "CoffeeWorks $version"
          $arguments = @("release", "create", $tag, $setup, "$setup.sha256", "--repo", $env:GITHUB_REPOSITORY, "--target", $env:GITHUB_SHA, "--generate-notes")
          if ($stage) {
            $title += " " + $stage.Substring(0, 1).ToUpper() + $stage.Substring(1)
            $arguments += "--prerelease"
          } else {
            $arguments += "--latest"
          }
          $arguments += @("--title", $title)
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar la versión $tag" }
          Write-Host "Publicada $title"
