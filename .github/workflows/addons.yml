name: Complementos

# Compila los complementos opcionales de la suite (Launcher › Complementos).
# - coffee-accdb: compatibilidad con Access. Jackcess compilado a un
#   ejecutable nativo con GraalVM, para que no haga falta instalar Java.
# - coffee-pdfcheck: revisión del PDF original en CoffeePDF. Tesseract OCR
#   con los idiomas español e inglés, en una sola carpeta.
# - coffee-raw: revelado RAW (LibRaw dcraw_emu) para CoffeeLens y CoffeePhoto.
# - coffee-potrace: calco vectorial (Potrace) para CoffeeVector y CoffeePaint.
# En las pull requests solo se compila y se prueba. En main (o a mano) se
# publica en la versión «addons», de donde lo descarga el Launcher.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["addons/**", ".github/workflows/addons.yml"]
  pull_request:
    paths: ["addons/**", ".github/workflows/addons.yml"]

permissions:
  contents: write

concurrency:
  group: addons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accdb:
    name: Compatibilidad con Access
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Compilar el JAR
        working-directory: addons/coffee-accdb
        run: mvn -B -q package

      - name: Compilar el ejecutable nativo
        working-directory: addons/coffee-accdb
        run: native-image --no-fallback -O2 -jar target/coffee-accdb.jar -o target/coffee-accdb

      - name: Probar la exportación
        working-directory: addons/coffee-accdb
        shell: pwsh
        run: |
          ./target/coffee-accdb.exe version
          ./target/coffee-accdb.exe export test/muestra.json "$env:RUNNER_TEMP\muestra.accdb"
          if ($LASTEXITCODE -ne 0) { throw "La exportación falló" }
          ./target/coffee-accdb.exe export test/muestra.json "$env:RUNNER_TEMP\muestra.mdb"
          if ($LASTEXITCODE -ne 0) { throw "La exportación a .mdb falló" }
          $size = (Get-Item "$env:RUNNER_TEMP\muestra.accdb").Length
          if ($size -lt 100000) { throw "El archivo .accdb es demasiado pequeño ($size bytes)" }
          Write-Host "Archivo .accdb de $size bytes"

      - name: Empaquetar
        working-directory: addons/coffee-accdb
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/coffee-accdb.exe dist/
          Copy-Item LICENSE-THIRD-PARTY.txt dist/
          Compress-Archive -Path dist/* -DestinationPath coffee-accdb-win64.zip -Force
          Get-Item coffee-accdb-win64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-accdb-win64
          path: addons/coffee-accdb/coffee-accdb-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: addons/coffee-accdb/coffee-accdb-win64.zip

  pdfcheck:
    name: Revisión del PDF original (Tesseract)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TESSDATA: https://github.com/tesseract-ocr/tessdata_fast/raw/main
    steps:
      - uses: actions/checkout@v4

      # Paquete de conda-forge: trae tesseract.exe y todas sus DLL sin
      # instaladores interactivos (el instalador NSIS se queda esperando).
      - name: Instalar Tesseract (conda-forge)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env_dir = "$env:RUNNER_TEMP\tessenv"
          & "$env:CONDA\Scripts\conda.exe" create -y -q -p $env_dir -c conda-forge --override-channels tesseract
          if ($LASTEXITCODE -ne 0) { throw "conda no pudo instalar Tesseract" }
          $exe = Get-ChildItem $env_dir -Recurse -Filter tesseract.exe | Select-Object -First 1
          if (-not $exe) { throw "El entorno no contiene tesseract.exe" }
          "TESS_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TESS_ENV=$env_dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $exe.FullName --version

      - name: Empaquetar
        working-directory: addons/coffee-pdfcheck
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$env:TESS_DIR\tesseract.exe" dist/
          # DLL de Tesseract y de sus dependencias (y el runtime de Visual C++ de la raíz del entorno)
          Get-ChildItem "$env:TESS_DIR" -Filter *.dll | Copy-Item -Destination dist/
          Get-ChildItem "$env:TESS_ENV" -Filter *.dll | Copy-Item -Destination dist/ -ErrorAction SilentlyContinue
          foreach ($lang in 'spa', 'eng') {
            Invoke-WebRequest -Uri "$env:TESSDATA/$lang.traineddata" -OutFile "dist/$lang.traineddata"
          }
          Copy-Item README.md dist/LEEME.md
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/LICENSE -OutFile dist/LICENSE-tesseract.txt
          Compress-Archive -Path dist/* -DestinationPath coffee-pdfcheck-win64.zip -Force
          Get-Item coffee-pdfcheck-win64.zip | Select-Object Name, Length

      - name: Probar el paquete
        working-directory: addons/coffee-pdfcheck
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Igual que CoffeeWorks: carpeta limpia, idiomas al lado del ejecutable
          Expand-Archive coffee-pdfcheck-win64.zip -DestinationPath "$env:RUNNER_TEMP\pdfcheck" -Force
          $env:TESSDATA_PREFIX = "$env:RUNNER_TEMP\pdfcheck"
          $out = & "$env:RUNNER_TEMP\pdfcheck\tesseract.exe" test/muestra.png stdout -l spa+eng --psm 3 tsv
          if ($LASTEXITCODE -ne 0) { throw "Tesseract terminó con error" }
          $text = ($out | Out-String)
          if ($text -notmatch 'programasion' -or $text -notmatch 'equipo') { throw "El OCR no reconoció el texto de prueba" }
          Write-Host "OCR correcto"

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-pdfcheck-win64
          path: addons/coffee-pdfcheck/coffee-pdfcheck-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: addons/coffee-pdfcheck/coffee-pdfcheck-win64.zip

  raw:
    name: Revelado RAW (LibRaw)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Conseguir dcraw_emu
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = "$env:RUNNER_TEMP\libraw"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = $null
          # 1) Compilación oficial de LibRaw para Windows
          foreach ($v in '0.21.3', '0.21.2', '0.21.1') {
            try {
              Invoke-WebRequest -Uri "https://www.libraw.org/data/LibRaw-$v-Win64.zip" -OutFile "$dir\libraw.zip"
              Expand-Archive "$dir\libraw.zip" -DestinationPath "$dir\official" -Force
              $exe = Get-ChildItem "$dir\official" -Recurse -Filter dcraw_emu.exe | Select-Object -First 1
              if ($exe) { Write-Host "LibRaw $v oficial"; break }
            } catch { Write-Host "LibRaw $v no disponible: $_" }
          }
          # 2) conda-forge
          if (-not $exe) {
            & "$env:CONDA\Scripts\conda.exe" create -y -q -p "$dir\env" -c conda-forge --override-channels libraw
            $exe = Get-ChildItem "$dir\env" -Recurse -Filter dcraw_emu.exe | Select-Object -First 1
          }
          if (-not $exe) { throw "No se encontró dcraw_emu.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/
          Get-ChildItem $exe.DirectoryName -Filter *.dll | Copy-Item -Destination dist/
          # En conda, las DLL de las dependencias están en Library\bin
          if (Test-Path "$dir\env\Library\bin") { Get-ChildItem "$dir\env\Library\bin" -Filter *.dll | Copy-Item -Destination dist/ }
          if (Test-Path "$dir\env") { Get-ChildItem "$dir\env" -Filter *.dll | Copy-Item -Destination dist/ -ErrorAction SilentlyContinue }
          Copy-Item addons/coffee-raw/README.md dist/LEEME.md
          Compress-Archive -Path dist/* -DestinationPath coffee-raw-win64.zip -Force
          Get-Item coffee-raw-win64.zip | Select-Object Name, Length

      - name: Probar el paquete
        shell: pwsh
        timeout-minutes: 3
        run: |
          Expand-Archive coffee-raw-win64.zip -DestinationPath "$env:RUNNER_TEMP\rawtest" -Force
          $out = (& "$env:RUNNER_TEMP\rawtest\dcraw_emu.exe" 2>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch 'LibRaw|dcraw|Usage|usage') { throw "dcraw_emu no arranca (¿faltan DLL?)" }
          # Sin argumentos muestra la ayuda y sale con código 1: arrancar es lo que se comprueba
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-raw-win64
          path: coffee-raw-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-raw-win64.zip

  potrace:
    name: Calco vectorial (Potrace)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Conseguir Potrace
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = "$env:RUNNER_TEMP\potrace"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = $null
          try {
            Invoke-WebRequest -Uri "https://potrace.sourceforge.net/download/1.16/potrace-1.16.win64.zip" -OutFile "$dir\potrace.zip"
            Expand-Archive "$dir\potrace.zip" -DestinationPath "$dir\official" -Force
            $exe = Get-ChildItem "$dir\official" -Recurse -Filter potrace.exe | Select-Object -First 1
          } catch { Write-Host "Descarga oficial fallida: $_" }
          if (-not $exe) {
            & "$env:CONDA\Scripts\conda.exe" create -y -q -p "$dir\env" -c conda-forge --override-channels potrace
            $exe = Get-ChildItem "$dir\env" -Recurse -Filter potrace.exe | Select-Object -First 1
          }
          if (-not $exe) { throw "No se encontró potrace.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/
          Get-ChildItem $exe.DirectoryName -Filter *.dll | Copy-Item -Destination dist/
          if (Test-Path "$dir\env\Library\bin") { Get-ChildItem "$dir\env\Library\bin" -Filter *.dll | Copy-Item -Destination dist/ }
          Copy-Item addons/coffee-potrace/README.md dist/LEEME.md
          Compress-Archive -Path dist/* -DestinationPath coffee-potrace-win64.zip -Force
          Get-Item coffee-potrace-win64.zip | Select-Object Name, Length

      - name: Probar el paquete
        shell: pwsh
        timeout-minutes: 3
        run: |
          Expand-Archive coffee-potrace-win64.zip -DestinationPath "$env:RUNNER_TEMP\potest" -Force
          & "$env:RUNNER_TEMP\potest\potrace.exe" -s --flat -o "$env:RUNNER_TEMP\out.svg" addons/coffee-potrace/test/muestra.bmp
          if ($LASTEXITCODE -ne 0) { throw "Potrace terminó con error" }
          $svg = Get-Content "$env:RUNNER_TEMP\out.svg" -Raw
          if ($svg -notmatch '<path') { throw "El SVG no contiene trazados" }
          Write-Host "Calco correcto"

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-potrace-win64
          path: coffee-potrace-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-potrace-win64.zip
