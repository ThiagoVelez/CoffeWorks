name: Complementos

# Compila los complementos opcionales de la suite (Launcher › Complementos).
# - coffee-accdb: compatibilidad con Access. Jackcess compilado a un
#   ejecutable nativo con GraalVM, para que no haga falta instalar Java.
# - coffee-pdfcheck: revisión del PDF original en CoffeePDF. Tesseract OCR
#   con los idiomas español e inglés, en una sola carpeta.
# - coffee-raw: revelado RAW (LibRaw dcraw_emu) para CoffeeLens y CoffeePhoto.
# - coffee-potrace: calco vectorial (Potrace) para CoffeeVector y CoffeePaint.
# - coffee-latex: Motor LaTeX (Tectonic) para CoffeeLatex y CoffeeConvert.
# - coffee-pandoc: conversor de documentos (Pandoc) para CoffeeLatex y CoffeeConvert.
# - coffee-latexocr: modelos de pix2tex (ONNX) para «Desde foto» de CoffeeLatex.
# - coffee-separarvoz: separar voz y música (MDX-Net de UVR) para CoffeeSound.
# - coffee-letra: Whisper small (sherpa-onnx) para sacar la letra en CoffeeSound.
# - coffee-puppetcompat: motor de seguimiento facial sin SIMD para CoffeePuppet.
# - coffee-ca3d-piezas: pack de piezas para CoffeeAnimate3D (archivos .ca3d).
# En las pull requests solo se compila y se prueba. En main (o a mano) se
# publica en la versión «addons», de donde lo descarga el Launcher.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["addons/**", ".github/workflows/addons.yml", "CoffeeAnimate3D/src/pieces.ts", "CoffeeLatex/src/foto/**", "CoffeeSound/src/voz/**"]
  pull_request:
    paths: ["addons/**", ".github/workflows/addons.yml", "CoffeeAnimate3D/src/pieces.ts", "CoffeeLatex/src/foto/**", "CoffeeSound/src/voz/**"]

permissions:
  contents: write

concurrency:
  group: addons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accdb:
    name: Compatibilidad con Access
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Compilar el JAR
        working-directory: addons/coffee-accdb
        run: mvn -B -q package

      - name: Compilar el ejecutable nativo
        working-directory: addons/coffee-accdb
        run: native-image --no-fallback -O2 -jar target/coffee-accdb.jar -o target/coffee-accdb

      - name: Probar la exportación
        working-directory: addons/coffee-accdb
        shell: pwsh
        run: |
          ./target/coffee-accdb.exe version
          ./target/coffee-accdb.exe export test/muestra.json "$env:RUNNER_TEMP\muestra.accdb"
          if ($LASTEXITCODE -ne 0) { throw "La exportación falló" }
          ./target/coffee-accdb.exe export test/muestra.json "$env:RUNNER_TEMP\muestra.mdb"
          if ($LASTEXITCODE -ne 0) { throw "La exportación a .mdb falló" }
          $size = (Get-Item "$env:RUNNER_TEMP\muestra.accdb").Length
          if ($size -lt 100000) { throw "El archivo .accdb es demasiado pequeño ($size bytes)" }
          Write-Host "Archivo .accdb de $size bytes"

      - name: Empaquetar
        working-directory: addons/coffee-accdb
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/coffee-accdb.exe dist/
          Copy-Item LICENSE-THIRD-PARTY.txt dist/
          Compress-Archive -Path dist/* -DestinationPath coffee-accdb-win64.zip -Force
          Get-Item coffee-accdb-win64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-accdb-win64
          path: addons/coffee-accdb/coffee-accdb-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: addons/coffee-accdb/coffee-accdb-win64.zip

  pdfcheck:
    name: Revisión del PDF original (Tesseract)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TESSDATA: https://github.com/tesseract-ocr/tessdata_fast/raw/main
    steps:
      - uses: actions/checkout@v4

      # Paquete de conda-forge: trae tesseract.exe y todas sus DLL sin
      # instaladores interactivos (el instalador NSIS se queda esperando).
      - name: Instalar Tesseract (conda-forge)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $env_dir = "$env:RUNNER_TEMP\tessenv"
          & "$env:CONDA\Scripts\conda.exe" create -y -q -p $env_dir -c conda-forge --override-channels tesseract
          if ($LASTEXITCODE -ne 0) { throw "conda no pudo instalar Tesseract" }
          $exe = Get-ChildItem $env_dir -Recurse -Filter tesseract.exe | Select-Object -First 1
          if (-not $exe) { throw "El entorno no contiene tesseract.exe" }
          "TESS_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TESS_ENV=$env_dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $exe.FullName --version

      - name: Empaquetar
        working-directory: addons/coffee-pdfcheck
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$env:TESS_DIR\tesseract.exe" dist/
          # DLL de Tesseract y de sus dependencias (y el runtime de Visual C++ de la raíz del entorno)
          Get-ChildItem "$env:TESS_DIR" -Filter *.dll | Copy-Item -Destination dist/
          Get-ChildItem "$env:TESS_ENV" -Filter *.dll | Copy-Item -Destination dist/ -ErrorAction SilentlyContinue
          foreach ($lang in 'spa', 'eng') {
            Invoke-WebRequest -Uri "$env:TESSDATA/$lang.traineddata" -OutFile "dist/$lang.traineddata"
          }
          Copy-Item README.md dist/LEEME.md
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/tesseract-ocr/tesseract/main/LICENSE -OutFile dist/LICENSE-tesseract.txt
          Compress-Archive -Path dist/* -DestinationPath coffee-pdfcheck-win64.zip -Force
          Get-Item coffee-pdfcheck-win64.zip | Select-Object Name, Length

      - name: Probar el paquete
        working-directory: addons/coffee-pdfcheck
        shell: pwsh
        timeout-minutes: 5
        run: |
          # Igual que CoffeeWorks: carpeta limpia, idiomas al lado del ejecutable
          Expand-Archive coffee-pdfcheck-win64.zip -DestinationPath "$env:RUNNER_TEMP\pdfcheck" -Force
          $env:TESSDATA_PREFIX = "$env:RUNNER_TEMP\pdfcheck"
          $out = & "$env:RUNNER_TEMP\pdfcheck\tesseract.exe" test/muestra.png stdout -l spa+eng --psm 3 tsv
          if ($LASTEXITCODE -ne 0) { throw "Tesseract terminó con error" }
          $text = ($out | Out-String)
          if ($text -notmatch 'programasion' -or $text -notmatch 'equipo') { throw "El OCR no reconoció el texto de prueba" }
          Write-Host "OCR correcto"

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-pdfcheck-win64
          path: addons/coffee-pdfcheck/coffee-pdfcheck-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: addons/coffee-pdfcheck/coffee-pdfcheck-win64.zip

  raw:
    name: Revelado RAW (LibRaw)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Conseguir dcraw_emu
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = "$env:RUNNER_TEMP\libraw"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = $null
          # 1) Compilación oficial de LibRaw para Windows
          foreach ($v in '0.21.3', '0.21.2', '0.21.1') {
            try {
              Invoke-WebRequest -Uri "https://www.libraw.org/data/LibRaw-$v-Win64.zip" -OutFile "$dir\libraw.zip"
              Expand-Archive "$dir\libraw.zip" -DestinationPath "$dir\official" -Force
              $exe = Get-ChildItem "$dir\official" -Recurse -Filter dcraw_emu.exe | Select-Object -First 1
              if ($exe) { Write-Host "LibRaw $v oficial"; break }
            } catch { Write-Host "LibRaw $v no disponible: $_" }
          }
          # 2) conda-forge
          if (-not $exe) {
            & "$env:CONDA\Scripts\conda.exe" create -y -q -p "$dir\env" -c conda-forge --override-channels libraw
            $exe = Get-ChildItem "$dir\env" -Recurse -Filter dcraw_emu.exe | Select-Object -First 1
          }
          if (-not $exe) { throw "No se encontró dcraw_emu.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/
          Get-ChildItem $exe.DirectoryName -Filter *.dll | Copy-Item -Destination dist/
          # En conda, las DLL de las dependencias están en Library\bin
          if (Test-Path "$dir\env\Library\bin") { Get-ChildItem "$dir\env\Library\bin" -Filter *.dll | Copy-Item -Destination dist/ }
          if (Test-Path "$dir\env") { Get-ChildItem "$dir\env" -Filter *.dll | Copy-Item -Destination dist/ -ErrorAction SilentlyContinue }
          Copy-Item addons/coffee-raw/README.md dist/LEEME.md
          Compress-Archive -Path dist/* -DestinationPath coffee-raw-win64.zip -Force
          Get-Item coffee-raw-win64.zip | Select-Object Name, Length

      - name: Probar el paquete
        shell: pwsh
        timeout-minutes: 3
        run: |
          Expand-Archive coffee-raw-win64.zip -DestinationPath "$env:RUNNER_TEMP\rawtest" -Force
          $out = (& "$env:RUNNER_TEMP\rawtest\dcraw_emu.exe" 2>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch 'LibRaw|dcraw|Usage|usage') { throw "dcraw_emu no arranca (¿faltan DLL?)" }
          # Sin argumentos muestra la ayuda y sale con código 1: arrancar es lo que se comprueba
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-raw-win64
          path: coffee-raw-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-raw-win64.zip

  potrace:
    name: Calco vectorial (Potrace)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Conseguir Potrace
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = "$env:RUNNER_TEMP\potrace"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = $null
          try {
            Invoke-WebRequest -Uri "https://potrace.sourceforge.net/download/1.16/potrace-1.16.win64.zip" -OutFile "$dir\potrace.zip"
            Expand-Archive "$dir\potrace.zip" -DestinationPath "$dir\official" -Force
            $exe = Get-ChildItem "$dir\official" -Recurse -Filter potrace.exe | Select-Object -First 1
          } catch { Write-Host "Descarga oficial fallida: $_" }
          if (-not $exe) {
            & "$env:CONDA\Scripts\conda.exe" create -y -q -p "$dir\env" -c conda-forge --override-channels potrace
            $exe = Get-ChildItem "$dir\env" -Recurse -Filter potrace.exe | Select-Object -First 1
          }
          if (-not $exe) { throw "No se encontró potrace.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/
          Get-ChildItem $exe.DirectoryName -Filter *.dll | Copy-Item -Destination dist/
          if (Test-Path "$dir\env\Library\bin") { Get-ChildItem "$dir\env\Library\bin" -Filter *.dll | Copy-Item -Destination dist/ }
          Copy-Item addons/coffee-potrace/README.md dist/LEEME.md
          Compress-Archive -Path dist/* -DestinationPath coffee-potrace-win64.zip -Force
          Get-Item coffee-potrace-win64.zip | Select-Object Name, Length

      - name: Probar el paquete
        shell: pwsh
        timeout-minutes: 3
        run: |
          Expand-Archive coffee-potrace-win64.zip -DestinationPath "$env:RUNNER_TEMP\potest" -Force
          & "$env:RUNNER_TEMP\potest\potrace.exe" -s --flat -o "$env:RUNNER_TEMP\out.svg" addons/coffee-potrace/test/muestra.bmp
          if ($LASTEXITCODE -ne 0) { throw "Potrace terminó con error" }
          $svg = Get-Content "$env:RUNNER_TEMP\out.svg" -Raw
          if ($svg -notmatch '<path') { throw "El SVG no contiene trazados" }
          Write-Host "Calco correcto"

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-potrace-win64
          path: coffee-potrace-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-potrace-win64.zip

  latex:
    name: Motor LaTeX (Tectonic)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Conseguir Tectonic
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = "$env:RUNNER_TEMP\tectonic"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $v = "0.15.0"
          Invoke-WebRequest -Uri "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40$v/tectonic-$v-x86_64-pc-windows-msvc.zip" -OutFile "$dir\t.zip"
          Expand-Archive "$dir\t.zip" -DestinationPath "$dir\x" -Force
          $exe = Get-ChildItem "$dir\x" -Recurse -Filter tectonic.exe | Select-Object -First 1
          if (-not $exe) { throw "No se encontró tectonic.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/
          Copy-Item addons/coffee-latex/README.md dist/LEEME.md
          Compress-Archive -Path dist/* -DestinationPath coffee-latex-win64.zip -Force
          Get-Item coffee-latex-win64.zip | Select-Object Name, Length

      - name: Probar el paquete
        shell: pwsh
        timeout-minutes: 8
        run: |
          Expand-Archive coffee-latex-win64.zip -DestinationPath "$env:RUNNER_TEMP\latest" -Force
          & "$env:RUNNER_TEMP\latest\tectonic.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Tectonic no arranca" }
          Copy-Item addons/coffee-latex/test/muestra.tex "$env:RUNNER_TEMP\latest\documento.tex"
          Push-Location "$env:RUNNER_TEMP\latest"
          & .\tectonic.exe -X compile --keep-logs documento.tex
          if ($LASTEXITCODE -ne 0) { throw "Tectonic no pudo compilar la muestra" }
          Pop-Location
          if (-not (Test-Path "$env:RUNNER_TEMP\latest\documento.pdf")) { throw "No se generó el PDF" }
          Write-Host "Compilación correcta"

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-latex-win64
          path: coffee-latex-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-latex-win64.zip

  pandoc:
    name: Conversor de documentos (Pandoc)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Conseguir Pandoc
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $dir = "$env:RUNNER_TEMP\pandoc"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $v = "3.5"
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-windows-x86_64.zip" -OutFile "$dir\p.zip"
          Expand-Archive "$dir\p.zip" -DestinationPath "$dir\x" -Force
          $exe = Get-ChildItem "$dir\x" -Recurse -Filter pandoc.exe | Select-Object -First 1
          if (-not $exe) { throw "No se encontró pandoc.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/
          Get-ChildItem $exe.DirectoryName -Filter COPYING* | Copy-Item -Destination dist/
          Copy-Item addons/coffee-pandoc/README.md dist/LEEME.md
          Compress-Archive -Path dist/* -DestinationPath coffee-pandoc-win64.zip -Force
          Get-Item coffee-pandoc-win64.zip | Select-Object Name, Length

      - name: Probar el paquete
        shell: pwsh
        timeout-minutes: 3
        run: |
          Expand-Archive coffee-pandoc-win64.zip -DestinationPath "$env:RUNNER_TEMP\pantest" -Force
          $exe = "$env:RUNNER_TEMP\pantest\pandoc.exe"
          & $exe --version
          & $exe -f latex -t docx -o "$env:RUNNER_TEMP\out.docx" addons/coffee-latex/test/muestra.tex
          if ($LASTEXITCODE -ne 0) { throw "Pandoc no pudo convertir la muestra" }
          $md = & $exe -f latex -t markdown addons/coffee-latex/test/muestra.tex | Out-String
          if ($md -notmatch 'Caída libre') { throw "La conversión a Markdown no trae el texto" }
          Write-Host "Conversión correcta"

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-pandoc-win64
          path: coffee-pandoc-win64.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-pandoc-win64.zip

  latexocr:
    name: Fórmulas desde foto (pix2tex ONNX)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Descargar y comprobar los modelos
        run: |
          set -e
          mkdir -p dist
          base=https://github.com/RapidAI/RapidLaTeXOCR/releases/download/v0.0.0
          for f in encoder.onnx decoder.onnx image_resizer.onnx tokenizer.json; do
            curl -fsSL --retry 3 -o "dist/$f" "$base/$f"
          done
          cd dist
          cat > ../huellas.txt <<'HUELLAS'
          bd695497bf1b22279b7626f5916c79226e1e244c84355f8da7edfd2d921d0072  decoder.onnx
          01bf5dc25539ca0cd5b1bd29296ea495977a6ba5f629dc4178277809d26e5e7d  encoder.onnx
          e0b075c39700f64d50400f39c8fc186bbb3b5d84d31864008313f376603aca9d  image_resizer.onnx
          1dc27b18d6a518d0d5ff3f4bb7bd98521fe80ad39e5b2a246d4109f1bb9d5019  tokenizer.json
          HUELLAS
          sed -i 's/^ *//' ../huellas.txt
          sha256sum -c ../huellas.txt
          cp ../addons/coffee-latexocr/README.md LEEME.md
          curl -fsSL --retry 3 -o LICENCIA-pix2tex.txt https://raw.githubusercontent.com/lukas-blecher/LaTeX-OCR/main/LICENSE
          curl -fsSL --retry 3 -o LICENCIA-RapidLaTeXOCR.txt https://raw.githubusercontent.com/RapidAI/RapidLaTeXOCR/main/LICENSE
          zip -q -9 ../coffee-latexocr.zip *
          ls -la ../coffee-latexocr.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar el reconocimiento con fórmulas de muestra
        working-directory: CoffeeLatex
        run: |
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/latexocr"
          unzip -q ../coffee-latexocr.zip -d "$RUNNER_TEMP/latexocr"
          OCR_MODELOS="$RUNNER_TEMP/latexocr" npx tsx --test src/foto/latexocr.test.ts | tee salida.txt
          grep -q "^# pass 3" salida.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-latexocr
          path: coffee-latexocr.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-latexocr.zip

  separarvoz:
    name: Separar voz y música (MDX-Net de UVR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Descargar y comprobar el modelo
        run: |
          set -e
          mkdir -p dist
          curl -fsSL --retry 3 -o dist/voc_ft.onnx https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Voc_FT.onnx
          echo "534b2070fcc7df514b13ef660dc8cbb328679c2374d04354a5c42bb14ecce111  dist/voc_ft.onnx" | sha256sum -c
          cp addons/coffee-separarvoz/README.md dist/LEEME.md
          (cd dist && zip -q -9 ../coffee-separarvoz.zip *)
          ls -la coffee-separarvoz.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar la separación con la mezcla de muestra
        working-directory: CoffeeSound
        run: |
          npm ci --no-audit --no-fund
          SEP_MODELOS="$GITHUB_WORKSPACE/dist" npx tsx --test src/voz/separar.test.ts | tee salida.txt
          grep -q "^# skipped 0" salida.txt
          grep -q "^# fail 0" salida.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-separarvoz
          path: coffee-separarvoz.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-separarvoz.zip

  letra:
    name: Letra de canciones (Whisper small)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Descargar y comprobar el modelo
        run: |
          set -e
          mkdir -p dist
          curl -fsSL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-whisper-small.tar.bz2 \
            | tar xjf - --strip-components=1 -C dist --wildcards '*/small-encoder.int8.onnx' '*/small-decoder.int8.onnx' '*/small-tokens.txt'
          cd dist
          printf '%s\n' \
            "4cbe7b22fa9026b843b60a68640c747de05bafb1a11b57edc0e66c232d9f33a9  small-encoder.int8.onnx" \
            "acad50b5c782696e91b55914cc5ab4f756f1532f76e22aa6fc615f39fb69a8ee  small-decoder.int8.onnx" \
            "b34b360dbb493e781e479794586d661700670d65564001f23024971d1f2fa126  small-tokens.txt" | sha256sum -c
          cp ../addons/coffee-letra/README.md LEEME.md
          curl -fsSL --retry 3 -o LICENCIA-Whisper.txt https://raw.githubusercontent.com/openai/whisper/main/LICENSE
          curl -fsSL --retry 3 -o LICENCIA-sherpa-onnx.txt https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/master/LICENSE
          zip -q -9 ../coffee-letra.zip *
          ls -la ../coffee-letra.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar la transcripción con una frase de muestra
        working-directory: CoffeeSound
        run: |
          npm ci --no-audit --no-fund
          LETRA_MODELOS="$GITHUB_WORKSPACE/dist" npx tsx --test src/voz/whisper.test.ts | tee salida.txt
          grep -q "^# skipped 0" salida.txt
          grep -q "^# fail 0" salida.txt

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-letra
          path: coffee-letra.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-letra.zip

  puppetcompat:
    name: Compatibilidad de CoffeePuppet (MediaPipe sin SIMD)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Empaquetar el motor sin SIMD
        run: |
          # Misma versión que usa CoffeePuppet
          VERSION=$(node -p "require('./CoffeePuppet/package.json').dependencies['@mediapipe/tasks-vision'].replace(/^[^0-9]*/, '')")
          echo "Versión: $VERSION"
          npm pack "@mediapipe/tasks-vision@$VERSION" --silent
          mkdir -p pkg dist
          tar -xzf mediapipe-tasks-vision-*.tgz -C pkg
          cp pkg/package/wasm/vision_wasm_nosimd_internal.js pkg/package/wasm/vision_wasm_nosimd_internal.wasm dist/
          cp addons/coffee-puppetcompat/README.md dist/LEEME.md
          (cd dist && zip -q -9 ../coffee-puppetcompat.zip *)
          ls -la coffee-puppetcompat.zip

      - name: Probar el paquete
        run: |
          unzip -l coffee-puppetcompat.zip
          unzip -l coffee-puppetcompat.zip | grep -q vision_wasm_nosimd_internal.wasm
          unzip -l coffee-puppetcompat.zip | grep -q vision_wasm_nosimd_internal.js

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-puppetcompat
          path: coffee-puppetcompat.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-puppetcompat.zip

  ca3dpiezas:
    name: Pack de piezas de CoffeeAnimate3D
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar que las piezas están al día
        working-directory: CoffeeAnimate3D
        run: |
          npm ci --no-audit --no-fund
          npx tsx --test src/pieces.test.ts

      - name: Empaquetar
        run: |
          (cd addons/coffee-ca3d-piezas && cp README.md LEEME.md && zip -q -9 ../../coffee-ca3d-piezas.zip piezas.json LEEME.md *.ca3d && rm LEEME.md)
          unzip -l coffee-ca3d-piezas.zip | grep -q piezas.json
          ls -la coffee-ca3d-piezas.zip

      - uses: actions/upload-artifact@v4
        with:
          name: coffee-ca3d-piezas
          path: coffee-ca3d-piezas.zip

      - name: Publicar en la versión «addons»
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Complementos de CoffeeWorks
          body: Complementos opcionales que el Launcher descarga desde «Complementos». No hace falta descargarlos a mano.
          prerelease: false
          make_latest: false
          files: coffee-ca3d-piezas.zip
